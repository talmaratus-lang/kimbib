<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jual Kimbib - Kimbab Praktis</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fffbe6;
      color: #3b3a30;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #fff;
      max-width: 480px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 25px;
      text-align: center;
    }
    h1 {
      color: #e67e22;
      font-weight: 700;
      margin-bottom: 0;
      letter-spacing: 2px;
    }
    .price {
      font-size: 22px;
      font-weight: 600;
      margin: 10px 0 20px;
      color: #27ae60;
    }
    .desc {
      font-style: italic;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .img-kimbib {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(230,126,34,0.3);
    }
    .options {
      text-align: left;
      margin-bottom: 25px;
    }
    .options label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    select, .price-package {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #e67e22;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .price-package {
      margin-top: 10px;
      background-color: #f8e5d1;
      color: #d35400;
      font-weight: 700;
      text-align: center;
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kimbib</h1>
    <img class="img-kimbib" src="https://i.imgur.com/i4vKkHV.jpg" alt="Kimbib Kimbab" />
    <p class="price">Harga: Rp 10.000 / porsi | Rp 2.000 / slice</p>
    <p class="desc">
      Solusi lapar instan tanpa ribet cucian, kenyang praktis, kantong ga krisis!
    </p>
    <div class="options">
      <label for="cocolan">Cocolan Kecap Asin:</label>
      <select id="cocolan" name="cocolan">
        <option value="ori">Ori</option>
        <option value="mayo">Toping Mayo</option>
      </select>
    </div>
    <div class="options">
      <label for="paket">Pilih Paket:</label>
      <select id="paket" name="paket">
        <option value="solo">Solo Kimbib - Rp 10.000</option>
        <option value="solo-slice">Slice Kimbib (1 Slice) - Rp 2.000</option>
        <option value="paket">Paket Kimbib + Es Teh Manis - Rp 15.000</option>
      </select>
      <div class="price-package" id="price-package">Harga Paket: Rp 15.000</div>
    </div>
    <div class="footer">
      *Pesan sekarang dan nikmati kimbib segar dengan harga hemat!<br/>
      *Es Teh Manis segelas sebagai teman kenikmatanmu.
    </div>
  </div>

  <script>
    const paketSelect = document.getElementById('paket');
    const priceDisplay = document.getElementById('price-package');

    paketSelect.addEventListener('change', () => {
      const val = paketSelect.value;
      let priceText = "";
      if(val === "solo") {
        priceText = "Harga Paket: Rp 10.000";
      } else if(val === "solo-slice") {
        priceText = "Harga Paket: Rp 2.000";
      } else if(val === "paket") {
        priceText = "Harga Paket: Rp 15.000";
      }
      priceDisplay.textContent = priceText;
    });
  </script>
</body>
</html>
